<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>photo-cutout-forge · 三明治母版（顶栏＋底栏）</title>
<!--
  poster-sandwich-master.html - master template for the "top bar + bottom bar (sandwich)" skeleton
  Source: three reference posters from the EASTERN ESSENCE series (provided by the lead on 2026-10-10);
        skeleton definition in cultural-event-key-visual/references/composition-library.md, appendix "Skeleton 1".

  ⚠ Font-size principle (revised after the 2026-10-10 group review)
    **Do not copy the reference poster's font sizes.** The reference uses a restrained "clean beige paper + tiny grey text" style;
    following its proportions, or copying them onto a busy material, makes the text too small.
    **Set sizes by "how large the type zone can hold"** - as long as it does not press the seam, does not overflow the width, and passes the machine check, enlarge as much as possible.

  ⚠ But enlarging the font size **must not remove the layout's defining feature** (the lead pointed this out on 2026-10-11)
    The bottom bar's defining feature is **flush to both ends** (left edge against left, right edge against right).
    I once enlarged the sizes and changed it to "a block of info on the left + an icon on the right", which **degenerated into left alignment** - that was wrong.
    The correct fix is to split into lines, **each line using space-between**, rather than dropping the alignment.

  Division of labour with poster-cutout-master.html:
    four-layout master - text block pinned to a corner of the frame (hero-top/right/left/centre), suits compositions with the subject in the mid-frame.
    this master - top bar + bottom bar, two info bands; the whole mid-section is left for the image; **suits torn-paper / seam-type backgrounds**
                 (the seam naturally falls in the mid-section, and the two material bands above and below carry the type).

  Fonts (assets/fonts/, bundled):
    Chinese  ⚠ Honour hard requirement 2 "calligraphic art font, not a regular font" -
            main title  ZhiMangXing Zhimang Xingshu (--f-zh-brush)
            subtitle    MaShanZheng Mashan Zheng regular-script brush (--f-zh-brush2)
            info layer  sans (--f-zh-sans) - only "modern info layers" like organiser/exhibition/button may use sans
            **Do not set Chinese titles in Huawen Zhongsong / Song** (that is a regular font and breaks requirement 2).
    English  Inter (SIL OFL) - from 2026-10-11 the English layer switched entirely to Inter (same as the old finalised version),
            EB Garamond serif proved "too thin, cannot hold the frame" in practice and is dropped (its @font-face is kept for now).

  ⚠ Legibility plating: torn-paper / rock-wall backgrounds have very low P5 (Dunhuang case measured 98; deep ink only 2.48:1),
    **text must get a light-colour stroke** (.halo), or small text simply smears.
    But note: the stroke only improves human readability, **not the machine-check numbers** - the text colour itself must still be dark enough (use pure black).

  Usage:
    Chinese  <body data-lang="zh" data-sandwich>
    English  <body data-lang="en" data-sandwich>
    machine check  ?pf-qa=bg hides text ink / #pf-boxes exports text boxes
-->
<style>
  /* ---------- Chinese calligraphic fonts (local, bundled) ---------- */
  @font-face { font-family: "ZhiMangXing";  src: url("fonts/ZhiMangXing-Regular.ttf")  format("truetype"); font-display: block; }
  @font-face { font-family: "MaShanZheng";  src: url("fonts/MaShanZheng-Regular.ttf")  format("truetype"); font-display: block; }
  @font-face { font-family: "LiuJianMaoCao"; src: url("fonts/LiuJianMaoCao-Regular.ttf") format("truetype"); font-display: block; }

  /* ---------- English (EB Garamond, SIL OFL, bundled) ---------- */
  @font-face {
    font-family: "EB Garamond";
    src: url("fonts/EBGaramond-Variable.ttf") format("truetype");
    font-weight: 400 900;          /* variable font: a single weight axis covers everything */
    font-display: block;
  }

  :root {
    --stage-w: 1500px;
    --stage-h: 1875px;

    --ink:      #000000;           /* pure black: required on earth-wall / rock-wall mid-brown grounds (in practice #271B0D falls just short of passing) */
    --ink-2:    #14100B;
    --halo:     rgba(246, 242, 232, 0.88);
    --halo-soft:rgba(246, 242, 232, 0.50);
    --stage-bg: #EFE7D4;

    /* ★ English font switch (specified by the lead on 2026-10-11): the English reference uses the old finalised version (Inter Black),
     EB Garamond serif proved "too thin, cannot hold the frame" - the English layer switched entirely to Inter. */
  --f-en: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    /* Chinese, three tiers: title in running script / subtitle in regular script / info layer in sans.
       The fallback chain links only **same-family calligraphic faces**, never ending in cursive -
       a generic family name makes "font failed to load" silently degrade to a system regular font, quietly breaking hard requirement 2. */
    --f-zh-brush:  "ZhiMangXing", "MaShanZheng", "LiuJianMaoCao";
    --f-zh-brush2: "MaShanZheng", "ZhiMangXing", "LiuJianMaoCao";
    --f-zh-sans:   "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", sans-serif;

    --margin: 78px;                /* left/right safe margin ≈5.2% */
    --top-y: 60px;

    /* Letter spacing: letter-spacing also applies after the last glyph, leaving one extra gap on the element's right.
       Manage it with a variable; the right word eats the extra gap with a negative margin (see .word.right). */
    --track-main: 0.06em;
    --track-sub:  0.34em;
    --size-main:  108px;
    --size-sub:   28px;            /* top-bar sub text: 24->28 */
    --size-bar:   28px;            /* bottom-bar info-bar base value (overridden per language block) */
    --weight-main: 400;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #17130E; }

  .stage {
    position: relative;
    width: var(--stage-w);
    height: var(--stage-h);
    overflow: hidden;
    background: var(--stage-bg);
  }
  .stage > .bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    display: block;
  }
  .type { position: absolute; inset: 0; color: var(--ink); }

  /* ---------- Legibility plating: light-colour stroke + soft glow ----------
     ⚠ Torn-paper / rock-wall grounds are **highly textured** (Dunhuang measured std 19-29 inside the glyph box),
     thin black strokes "smear" into the texture - a flaw the **contrast numbers cannot reveal**
     (CR all passes, mid aperture still 8.5+), so the strokes need a light-colour outline
     to lift them out of the busy ground.
     `paint-order: stroke fill` is the key: it paints the stroke **under** the glyph body,
     otherwise the stroke eats into the strokes and the glyph gets thinner. */
  .halo {
    -webkit-text-stroke: 1.8px rgba(248, 244, 236, 0.92);
    paint-order: stroke fill;
    text-shadow:
      0 0 8px rgba(248, 244, 236, 0.65),
      0 0 20px rgba(248, 244, 236, 0.32);
  }
  /* larger glyphs get a slightly thicker stroke in proportion; small glyphs keep 1.8px (relatively more visible) */
  .w-main { -webkit-text-stroke-width: 2.4px; }

  /* ---------- Art lettering: span effect generated by scripts/art_title.py ----------
     The Chinese main titles on the reference posters (intangible-heritage series: bamboo weaving / Huizhou lanterns / beauty of intangible heritage)
     are **not set neatly in one row**, but **varied sizes + vertical stretch + vertical offset + slight rotation**,
     with a "handwritten, dynamic" feel.
     **The font stays the same** (still calligraphic); only the effect changes; parameters are generated programmatically by art_title.py (seed reproducible).
     ⚠ `transform-origin: 50% 82%` (**pivoting on the glyph foot**): stretching grows upward,
       so it never breaks the baseline nor pushes the whole group out of the safe area. */
  /* ⚠ Leave margin for the transform: a rotated / stretched glyph overflows the span's box,
     and Chrome's scrollWidth/Height **will** count it in -> the machine check flags overflow.
     padding expands + negative margin cancels it, so the visual position is unchanged. */
  .art {
    display: flex; align-items: flex-start;
    /* The margin must be given in em and large enough: `--dy` max ±16px; on a small-size layout (axis 124px) 0.07em is only 8.7px,
       not enough -> the glyph overflows and gets counted into scrollHeight, flagged as overflow. 0.15em stays safe down to the smallest size. */
    padding: 0.15em 0.12em;
    margin: -0.15em -0.12em;
  }
  .art > span {
    display: inline-block;
    font-size: calc(1em * var(--s, 1));
    transform: translateY(var(--dy, 0)) rotate(var(--rot, 0deg)) scaleY(var(--sy, 1));
    transform-origin: 50% 82%;
  }
  .art.silhouette > span { color: transparent; -webkit-text-stroke: 3px var(--ink); }
  .w-main.art, .big.art { letter-spacing: 0; }          /* art lettering must be tight; letter spacing is left to the spans */
  .word.right .w-main.art { margin-right: 0; }          /* no letter spacing now, so drop the last-glyph compensation too */

  /* ================= top bar ================= */
  .bar-top {
    position: absolute;
    left: var(--margin); right: var(--margin); top: var(--top-y);
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .word { display: flex; flex-direction: column; }
  .word.right { align-items: flex-end; }

  .w-main {
    font-size: var(--size-main);
    font-weight: var(--weight-main);
    /* ⚠ line-height must not be smaller than the font's hhea line height (Latin ≈1.21, Chinese calligraphic ≈1.4).
       Below that the glyph overflows the line box top and bottom -> scrollHeight > clientHeight -> the machine check flags overflowY
       (hit twice: Inter at 0.98 overflowed 33px; Chinese at 1.02 made the title overflow twice). */
    line-height: 1.30;
    letter-spacing: var(--track-main);
    /* ⚠ The top bar's two words **must stay on one line** (a layout feature). Measured with Inter Black: VISIONS 4.254em /
       ON THE WALL 6.998em + letter spacing 0.72em ≈ 11.97em, plus the 84px mark <= live area 1332
       -> font-size ceiling ≈104px (hence English set to 102px).
       `nowrap` is **intentional**: when space is tight, we prefer the machine check flagging overflowX
       over **silent line wrapping** turning "two words on one row" into three rows (hit on 2026-10-11). */
    white-space: nowrap;
  }
  .w-sub {
    font-size: var(--size-sub);
    letter-spacing: var(--track-sub);
    color: var(--ink-2);
    margin-top: 16px;
  }
  /* last-glyph spacing compensation: the right-aligned word's negative margin eats the extra gap, keeping it visually flush to the right margin */
  .word.right .w-main { margin-right: calc(-1 * var(--track-main)); }
  .word.right .w-sub  { margin-right: calc(-1 * var(--track-sub)); }

  /* mark: square frame + concentric circles (caisson-ceiling / moon-disk motif), pure CSS, no text */
  .mark {
    width: 84px; height: 84px;
    border: 3px solid currentColor;
    display: grid; place-items: center;
    margin-top: 20px;
    flex: none;
  }
  .mark::before {
    content: ""; grid-area: 1 / 1;
    width: 44px; height: 44px;
    border: 3px solid currentColor; border-radius: 50%;
  }
  .mark::after {
    content: ""; grid-area: 1 / 1;
    width: 13px; height: 13px;
    background: currentColor; border-radius: 50%;
  }

  /* ================= bottom bar ================= */
  /* ⚠ Bottom bar: **two rows x each row flush to both ends** - preserves the reference poster's "flush to both ends" skeleton feature.
     Pitfall: after enlarging sizes, "one row, three segments" crowd into each other - flex's space-between
     compresses the segment gaps to 0 when content nearly fills the width, gluing the three texts into one blob (found in practice).
     **But never let that degenerate into left alignment** (a blob of info on the left + an icon on the right) - that loses the layout feature (the lead pointed this out).
     Correct fix: split into two rows, **each row using space-between**:
       row 1  institution · venue  |  dates
       row 2  hours               |  icon */
  .bar-bottom {
    position: absolute;
    left: var(--margin); right: var(--margin); bottom: 5.6%;
    display: flex; flex-direction: column; gap: 16px;
    font-size: var(--size-bar);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  /* Each row flush to both ends - preserves the reference poster's "flush to both ends" skeleton feature.
     ⚠ Do not write it as "a blob of info on the left + a button on the right", which degenerates into left alignment (hit on 2026-10-11). */
  .bar-bottom .row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 30px;
  }
  /* Booking button: the info layer's "call to action". A dark-ground light-type pill -
     ⚠ The exhibition info must land on the poster **in full** (subtitle / tagline / dates / hours / venue / booking),
     do not cut it for "minimalism" (the lead pointed this out on 2026-10-11). */
  .cta {
    display: inline-block; align-self: center;
    padding: 15px 42px; border-radius: 999px;
    background: var(--ink); color: #F2E9D8;
    font-size: 26px;
    letter-spacing: 0.14em; text-indent: 0.14em;
    text-decoration: none;
  }
  .bar-bottom .sep {
    display: block; width: 1px; height: 26px;
    background: currentColor; opacity: 0.55; flex: none;
  }
  .icons { display: flex; align-items: center; gap: 15px; flex: none; }
  .icons i { display: block; width: 21px; height: 21px; border: 2px solid currentColor; }
  .icons i.ci  { border-radius: 50%; }
  .icons i.dia { transform: rotate(45deg); }

  /* ================= language ================= */
  /* Chinese: title in running script (requirement 2) / subtitle · tagline in regular script / pure info layer in sans */
  body[data-lang="zh"] .bar-top    { font-family: var(--f-zh-brush2); }
  body[data-lang="zh"] .bar-bottom { font-family: var(--f-zh-sans); font-weight: 600; }
  /* ★ Promotional copy (subtitle / tagline) belongs to the **calligraphy layer**, not the info layer - setting it in sans / Song looks "cheap"
     (the lead pointed this out on 2026-10-11; the reference poster's subtitle also has a regular-script feel).
     Only **pure info** like dates / hours / venue / CTA may use sans. */
  body[data-lang="zh"] .bar-bottom .brush {
    font-family: var(--f-zh-brush2);
    font-weight: 400;              /* regular script not bolded: bolding smears the brush tips */
    letter-spacing: 0.10em;
  }

  body[data-lang="zh"] {
    --size-main: 220px;            /* 196->220 */
    --track-main: 0.10em;          /* running script connects strokes, so give only a little letter-spacing breathing room */
    --track-sub:  0.22em;
    --size-bar:   32px;            /* split into two rows so 32 fits */
  }
  body[data-lang="zh"] .w-main { font-family: var(--f-zh-brush); }

  body[data-lang="en"] .bar-top,
  body[data-lang="en"] .bar-bottom { font-family: var(--f-en); }

  body[data-lang="en"] {
    /* ★ English enlarged and weighted per the old finalised version (2026-10-11): Inter Black 900 holds the frame.
       The top bar's two words stay on one row (layout feature, not changed to the reference's stacked form); size derived backwards from "sum of two words <= live area":
       (4.28+7.03)em x 108 ≈ 1290 <= 1332 ✓ */
    --size-main: 102px;            /* 108->102: measured font-size ceiling ≈104px (two words + mark <= live area) */
    --track-main: 0.04em;
    --track-sub:  0.22em;
    --size-sub:   30px;            /* 28->30 */
    --size-bar:   30px;
    --weight-main: 900;            /* 500->900 */
  }
  body[data-lang="en"] .w-sub { font-weight: 700; }
  body[data-lang="en"] .bar-bottom { font-weight: 600; }
  /* bottom-bar first row is promotional copy (subtitle bold / tagline light), the rest is pure info - following the reference's hierarchy */
  body[data-lang="en"] .bar-bottom .row:first-child .brush:first-child {
    font-size: 32px; font-weight: 700; letter-spacing: 0.02em;
  }
  body[data-lang="en"] .bar-bottom .row:first-child .brush + .brush {
    font-size: 24px; font-weight: 400;
  }

  /* Machine-check instrument: under ?pf-qa=bg, hide all text ink colour and stroke.
     ⚠ `-webkit-text-stroke-color` **must be cleared together** - if only colour is cleared, the light stroke stays
     in the "text-free background" and check_contrast reads it as background luminance, inflating all numbers (found in practice:
     bgP95 jumped from level 150 to level 220; the error is invisible at a glance, yet the machine-check reference is already broken). */
  html.pf-qa-bg [data-text] {
    color: transparent !important;
    -webkit-text-stroke-color: transparent !important;
    text-shadow: none !important;
  }
</style>
</head>
<body data-lang="zh" data-sandwich>
  <div class="stage">
    <img class="bg" src="bg.png" alt="photo-cutout-forge 背景">

    <div class="type halo">
      <!-- ===== top bar: left word ▣ right word ===== -->
      <div class="bar-top">
        <div class="word">
          <div class="w-main" data-text="t-left">壁上</div>
          <div class="w-sub"  data-text="t-left-sub">敦煌色彩</div>
        </div>

        <div class="mark"></div>

        <div class="word right">
          <div class="w-main" data-text="t-right">万象</div>
          <div class="w-sub"  data-text="t-right-sub">2026</div>
        </div>
      </div>

      <!-- ===== bottom bar: full exhibition info (subtitle · tagline / dates · hours · venue) + booking button ===== -->
      <div class="bar-bottom">
        <div class="row">
          <span class="brush" data-text="b-1">敦煌色彩数字沉浸展</span>
          <span class="brush" data-text="b-2">在流动的色彩中，走近千年的想象</span>
        </div>
        <div class="row">
          <span data-text="b-3">展期 2026.11.8 – 2027.1.18</span>
          <span data-text="b-4">周二至周日 10:00–20:00</span>
        </div>
        <div class="row">
          <span data-text="b-5">城市文化中心 · 一层沉浸展厅</span>
          <a class="cta" href="#" data-text="cta">预约观展</a>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var q = new URLSearchParams(location.search);
    var lang = q.get('lang');
    if (lang) document.body.setAttribute('data-lang', lang);
    if (q.get('pf-qa') === 'bg') document.documentElement.classList.add('pf-qa-bg');

    function dump() {
      var out = [];
      document.querySelectorAll('[data-text]').forEach(function (el) {
        var r = el.getBoundingClientRect(), cs = getComputedStyle(el);
        out.push({
          role: el.getAttribute('data-text'),
          x: r.x, y: r.y, w: r.width, h: r.height,
          color: cs.color,
          fontSize: parseFloat(cs.fontSize),
          writingMode: cs.writingMode || 'horizontal-tb',
          fontFamily: cs.fontFamily,
          text: (el.innerText || '').replace(/\s+/g, ' ').trim(),
          overflowX: el.scrollWidth > el.clientWidth + 4,
          overflowY: el.scrollHeight > el.clientHeight + 4
        });
      });
      var s = document.createElement('script');
      s.type = 'application/json';
      s.id = 'pf-boxes';
      s.textContent = JSON.stringify(out);
      document.body.appendChild(s);
    }
    if (document.readyState === 'complete') dump();
    else window.addEventListener('load', dump);
  })();
  </script>
</body>
</html>
