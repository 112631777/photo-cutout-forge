<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>photo-cutout-forge · 左文母版（左文＋大留白）</title>
<!--
  poster-editorial-master.html - master template for the "text on the left + large negative space" skeleton
  Source: CHINA 2025 / @DNA2725 reference (provided by the lead on 2026-10-10; already abstracted into
        cultural-event-key-visual/references/composition-library.md, appendix "Skeleton 3" on 10-09).

  Structure: all text grouped in **one narrow column at the bottom-left**, the rest left blank.
        three tiny lines (copyright-style)     <- first gives a "source" feel
        CHINA / WALL VISION                    <- large title
        2 0 2 5 / 2 0 2 6                      <- small text with **widened letter spacing** (presence without enlarging)
        ©DNA2725 / BOOK NOW                    <- attribution
        ...rest all blank...

  Three points (from the reference poster's approach, do not drop them):
    1. **Extremely restrained information** - no info bar, no button block, only the fewest lines.
    2. **Small text gains presence through widened letter spacing**, not through enlarging (`2 0 2 5` is exactly this trick).
    3. The text block is left-aligned into one column; **the right side / the rest of the blank** is the main subject - do not stuff things into it.

  Division of labour with the other three masters:
    poster-cutout-master.html    four layouts, text pinned to a corner of the frame
    poster-sandwich-master.html  top bar + bottom bar, text in the two bands above and below
    poster-axis-master.html      centred axis, text on one central axis
    poster-editorial-master.html this master, text in **one column**, least information

  Fonts (assets/fonts/, bundled):
    Chinese  ⚠ Hard requirement 2 "calligraphic art font, not a regular font":
            title ZhiMangXing Zhimang Xingshu; info layer sans. **Do not set Chinese titles in Zhongsong / Song**.
    English  Inter (SIL OFL) - from 2026-10-11 the English layer switched entirely to Inter (same as the old finalised version),
            EB Garamond serif proved "too thin, cannot hold the frame" and is dropped (its @font-face kept for now).

  ⚠ Legibility plating: torn-paper / rock-wall backgrounds have very low P5, **text must get a light stroke** (.halo).
    The stroke only improves human readability, not the machine-check numbers - the text colour itself stays pure black.

  Usage: <body data-lang="zh|en" data-editorial>   machine check ?pf-qa=bg / #pf-boxes
-->
<style>
  /* ---------- Chinese calligraphic fonts (local, bundled) ---------- */
  @font-face { font-family: "ZhiMangXing";  src: url("fonts/ZhiMangXing-Regular.ttf")  format("truetype"); font-display: block; }
  @font-face { font-family: "MaShanZheng";  src: url("fonts/MaShanZheng-Regular.ttf")  format("truetype"); font-display: block; }
  @font-face { font-family: "LiuJianMaoCao"; src: url("fonts/LiuJianMaoCao-Regular.ttf") format("truetype"); font-display: block; }

  /* ---------- English (EB Garamond, SIL OFL, bundled) ---------- */
  @font-face {
    font-family: "EB Garamond";
    src: url("fonts/EBGaramond-Variable.ttf") format("truetype");
    font-weight: 400 900;
    font-display: block;
  }

  :root {
    --stage-w: 1500px;
    --stage-h: 1875px;

    --ink:      #000000;
    --ink-2:    #14100B;
    --ink-3:    #241B11;
    --halo:     rgba(246, 242, 232, 0.88);
    --halo-soft:rgba(246, 242, 232, 0.50);
    --stage-bg: #EFE7D4;

    /* ★ English font switch (specified by the lead on 2026-10-11): the English reference uses the old finalised version (Inter Black large title),
       EB Garamond serif proved "too thin, cannot hold the frame" - the English layer switched entirely to Inter. */
    --f-en: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    /* fallback chain links only same-family calligraphic faces, never ending in cursive */
    --f-zh-brush:  "ZhiMangXing", "MaShanZheng", "LiuJianMaoCao";
    --f-zh-sans:   "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", sans-serif;

    --margin: 84px;                /* left text column distance from the left edge */
    --bottom: 3.6%;                /* text block distance from bottom: the lower-left edge of the natural tear opening sits lower, so leave margin */

    /* Font-size principle (revised after the group review): **do not copy the reference poster's sizes** (reference smallest tier ≈15px@1500, too small),
       set by "how large the type zone can hold". This version is one notch larger overall than the first. */
    --size-tiny: 24px;             /* 20->24 */
    --size-big:  128px;            /* 110->128 */
    --size-year: 34px;             /* 28->34 */
    --size-sign: 40px;             /* 34->40 */
    --track-year: 0.62em;          /* year gains presence through widened letter spacing, not through enlarging */
    --lh-big: 1.30;                /* >= font hhea line height (Latin ≈1.21, Chinese calligraphic ≈1.4) */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #17130E; }

  .stage {
    position: relative;
    width: var(--stage-w);
    height: var(--stage-h);
    overflow: hidden;
    background: var(--stage-bg);
  }
  .stage > .bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    display: block;
  }
  .type { position: absolute; inset: 0; color: var(--ink); }

  /* ---------- Legibility plating: light-colour stroke + soft glow ----------
     ⚠ Torn-paper / rock-wall grounds are **highly textured** (Dunhuang measured std 19-29 inside the glyph box),
     thin black strokes "smear" into the texture - a flaw the **contrast numbers cannot reveal**,
     so the strokes need a light-colour outline to lift them out of the busy ground.
     `paint-order: stroke fill` is the key: it paints the stroke **under** the glyph body,
     otherwise it eats into the strokes and the glyph gets thinner. */
  .halo {
    -webkit-text-stroke: 1.8px rgba(248, 244, 236, 0.92);
    paint-order: stroke fill;
    text-shadow:
      0 0 8px rgba(248, 244, 236, 0.65),
      0 0 20px rgba(248, 244, 236, 0.32);
  }
  .big { -webkit-text-stroke-width: 2.4px; }

  /* ---------- Art lettering: span effect generated by scripts/art_title.py ----------
     The Chinese main titles on the reference posters (intangible-heritage series) are **not set neatly in one row**, but
     **varied sizes + vertical stretch + vertical offset + slight rotation**, with a handwritten, dynamic feel.
     **The font stays the same** (still calligraphic); parameters are generated programmatically by art_title.py (seed reproducible).
     ⚠ `transform-origin: 50% 82%` (**pivoting on the glyph foot**): stretching grows upward, never breaking the baseline. */
  /* ⚠ Leave margin for the transform: a rotated / stretched glyph overflows the span's box,
     and Chrome's scrollWidth/Height **will** count it in -> the machine check flags overflow.
     padding expands + negative margin cancels it, so the visual position is unchanged. */
  .art {
    display: flex; align-items: flex-start;
    /* The margin must be given in em and large enough: `--dy` max ±16px; on a small-size layout (axis 124px) 0.07em is only 8.7px,
       not enough -> the glyph overflows and gets counted into scrollHeight, flagged as overflow. 0.15em stays safe down to the smallest size. */
    padding: 0.15em 0.12em;
    margin: -0.15em -0.12em;
  }
  .art > span {
    display: inline-block;
    font-size: calc(1em * var(--s, 1));
    transform: translateY(var(--dy, 0)) rotate(var(--rot, 0deg)) scaleY(var(--sy, 1));
    transform-origin: 50% 82%;
  }
  .art.silhouette > span { color: transparent; -webkit-text-stroke: 3px var(--ink); }
  .w-main.art, .big.art { letter-spacing: 0; }

  /* ================= left text column ================= */
  .col {
    position: absolute;
    left: var(--margin); bottom: var(--bottom);
    display: flex; flex-direction: column; align-items: flex-start;
    max-width: 60%;
  }
  .tiny {
    display: flex; flex-direction: column; gap: 7px;
    font-size: var(--size-tiny);
    letter-spacing: 0.03em;
    color: var(--ink-2);
    line-height: 1.5;
  }
  .big {
    font-size: var(--size-big);
    font-weight: 400;
    line-height: var(--lh-big);
    letter-spacing: 0.02em;
    margin-top: 36px;
  }
  /* exhibition info, three lines (complete information)
     ⚠ Do not cut the exhibition info / tagline / booking for "minimalism" - these are the poster's practical information
     (the lead pointed this out on 2026-10-11). */
  .meta {
    display: flex; flex-direction: column; gap: 7px;
    font-size: var(--size-year);
    letter-spacing: 0.02em;
    color: var(--ink);
    margin-top: 24px;
    line-height: 1.45;
  }
  .cta {
    display: inline-block; align-self: flex-start; margin-top: 24px;
    padding: 14px 40px; border-radius: 999px;
    background: var(--ink); color: #F2E9D8;
    font-size: var(--size-sign);
    letter-spacing: 0.14em; text-indent: 0.14em;
    text-decoration: none;
  }

  /* ================= language ================= */
  /* ★ Promotional copy (.tiny: subtitle + tagline) belongs to the **calligraphy layer**, not the info layer -
     setting it in sans / Song looks "cheap" (the lead pointed this out on 2026-10-11).
     Only .meta (dates / hours / venue) and .cta, the **pure info**, may use sans. Regular script not bolded, to keep the brush tips. */
  body[data-lang="zh"] .tiny { font-family: var(--f-zh-brush2); font-weight: 400; letter-spacing: 0.10em; }
  body[data-lang="zh"] .year,
  body[data-lang="zh"] .sign { font-family: var(--f-zh-sans); font-weight: 600; }
  body[data-lang="zh"] .big  { font-family: var(--f-zh-brush); }

  body[data-lang="en"] .tiny,
  body[data-lang="en"] .year,
  body[data-lang="en"] .sign,
  body[data-lang="en"] .big  { font-family: var(--f-en); }

  body[data-lang="en"] {
    /* ★ English enlarged and weighted per the old finalised version (2026-10-11): measured ink on the reference image -
       l1 VISIONS ≈162px / l2 ON THE WALL ≈98px (both lines same width ≈692px),
       subtitle ≈32px/700, tagline ≈24px, meta ≈20px, CTA text ≈24px.
       This version has more info rows than the reference, and the block top is hard-constrained by the seam (SEAM bottom-left 1191) -
       first run at 156/96 put the block top at 1137.9, pressing the seam by 53px -> title shrunk to 146/88 (90% of the reference),
       other tiers tightened in step. **To enlarge further: first cut rows or run in parallel, do not delete information.** */
    --size-big:  146px;            /* l1 (92->146) */
    --size-big2: 88px;             /* l2 (new variable) */
    --size-year: 19px;             /* meta info rows (26->19, following the reference's restraint) */
    --size-sign: 24px;             /* CTA text (34->24, following the reference's pill proportion) */
    --size-tiny: 22px;             /* tagline; subtitle separately 30px (see below) */
    --lh-big:    1.21;             /* >= Inter hhea line height, cannot go smaller (overflowY pitfall) */
    --track-year: 0.02em;
    --bottom: 2.4%;                /* block grew taller, give a bit more bottom distance */
  }
  body[data-lang="en"] .big {
    font-weight: 900;              /* Inter Black: the key to holding the frame */
    letter-spacing: 0.04em;
    margin-top: 14px;              /* 36->14 */
  }
  body[data-lang="en"] .big .l1 { display: block; font-size: var(--size-big); }
  body[data-lang="en"] .big .l2 { display: block; font-size: var(--size-big2); margin-top: 2px; }
  /* ⚠ .big also carries .art (Chinese art lettering uses flex to lay spans horizontally) - the English l1/l2 are **two-line blocks**,
       so flex must be turned off, otherwise the two spans are squeezed onto one line and wrap (measured box compressed to 954px wide). */
  body[data-lang="en"] .big.art { display: block; }
  /* subtitle / tagline split into tiers (reference: subtitle bold, tagline light) */
  body[data-lang="en"] .tiny { margin-top: 0; gap: 5px; }
  body[data-lang="en"] .tiny span:nth-child(1) { font-size: 30px; font-weight: 700; letter-spacing: 0.02em; }
  body[data-lang="en"] .tiny span:nth-child(2) { font-size: 22px; font-weight: 400; }
  /* meta: label half a tier smaller + slightly lighter (still >= 4.5:1), value 600 */
  body[data-lang="en"] .meta { font-weight: 600; margin-top: 14px; gap: 5px; }
  body[data-lang="en"] .meta i {
    font-style: normal; font-weight: 500; font-size: 0.85em;
    letter-spacing: 0.10em; color: var(--ink-2); margin-right: 12px;
  }
  body[data-lang="en"] .cta { padding: 12px 34px; letter-spacing: 0.12em; margin-top: 12px; }

  /* Machine-check instrument: under ?pf-qa=bg, hide text ink colour and stroke.
     ⚠ `-webkit-text-stroke-color` **must be cleared together** - if only colour is cleared, the light stroke stays
     in the "text-free background" and is read as background luminance, inflating the machine-check numbers (found in practice). */
  html.pf-qa-bg [data-text] {
    color: transparent !important;
    -webkit-text-stroke-color: transparent !important;
    text-shadow: none !important;
  }
</style>
</head>
<body data-lang="zh" data-editorial>
  <div class="stage">
    <img class="bg" src="bg.png" alt="photo-cutout-forge 背景">

    <div class="type halo">
      <!-- ===== left text column: copyright-style small text -> large title -> letter-spaced year -> attribution ===== -->
      <div class="col">
        <div class="tiny">
          <span data-text="t-1">敦煌色彩数字沉浸展</span>
          <span data-text="t-2">在流动的色彩中，走近千年的想象</span>
        </div>
        <div class="big art" data-text="title">壁上万象</div>
        <div class="meta">
          <span data-text="m-1">展期 2026.11.8 – 2027.1.18</span>
          <span data-text="m-2">周二至周日 10:00–20:00</span>
          <span data-text="m-3">城市文化中心 · 一层沉浸展厅</span>
        </div>
        <a class="cta" href="#" data-text="cta">预约观展</a>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var q = new URLSearchParams(location.search);
    var lang = q.get('lang');
    if (lang) document.body.setAttribute('data-lang', lang);
    if (q.get('pf-qa') === 'bg') document.documentElement.classList.add('pf-qa-bg');

    function dump() {
      var out = [];
      document.querySelectorAll('[data-text]').forEach(function (el) {
        var r = el.getBoundingClientRect(), cs = getComputedStyle(el);
        out.push({
          role: el.getAttribute('data-text'),
          x: r.x, y: r.y, w: r.width, h: r.height,
          color: cs.color,
          fontSize: parseFloat(cs.fontSize),
          writingMode: cs.writingMode || 'horizontal-tb',
          fontFamily: cs.fontFamily,
          text: (el.innerText || '').replace(/\s+/g, ' ').trim(),
          overflowX: el.scrollWidth > el.clientWidth + 4,
          overflowY: el.scrollHeight > el.clientHeight + 4
        });
      });
      var s = document.createElement('script');
      s.type = 'application/json';
      s.id = 'pf-boxes';
      s.textContent = JSON.stringify(out);
      document.body.appendChild(s);
    }
    if (document.readyState === 'complete') dump();
    else window.addEventListener('load', dump);
  })();
  </script>
</body>
</html>
