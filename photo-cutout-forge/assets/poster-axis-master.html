<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>photo-cutout-forge · 中轴母版（汉字／英文交替）</title>
<!--
  poster-axis-master.html —— 「中轴居中（汉字／英文交替）」骨架专用母版
  来源：ORIENTAL ZEN 参考（2026-10-10 老大提供，10-09 已从同批参考抽象进
        cultural-event-key-visual/references/composition-library.md 附录「骨架二」）。

  结构（一条中轴走到底）：
        敦          ← 单字（汉字，书法体）    ↑
      壁上 / 万象    ← 主标题（两行）          │ 中轴文字区（落在上方素材带）
        煌          ← 单字（汉字，书法体）    ↓
      ...中段整片留给图像（撕纸中缝／视觉主体）...
        展讯两行      ← 小字，仍居中于中轴      ← 底部信息
  上下两个单字**合成一个词**（参考：东…方＝东方；本版：敦…煌＝敦煌），
  中间是它的名字 —— 这是这套骨架的题眼，不是随便放两个装饰字。

  与另两套母版的分工：
    poster-cutout-master.html  四版式，文字压画面某个角
    poster-sandwich-master.html 顶栏＋底栏，文字占上下两条带
    poster-axis-master.html     本母版，文字占一条中轴，**最克制、信息量最小**

  字体（assets/fonts/，随包）：
    中文  ⚠ 硬要求②「书法艺术字体，不用常规字体」：
          标题/单字 ZhiMangXing 志莽行书；副题 MaShanZheng 毛笔楷书；信息层 sans。
          **不要用华文中宋/宋体排中文标题**（本 skill 踩过）。
    英文  Inter（SIL OFL）—— 2026-10-11 起英文层全部改 Inter（旧版定稿同款），
          EB Garamond 衬线实测「太纤细、撑不起画面」已弃用（@font-face 暂留）。

  ⚠ 护读：撕纸/岩壁类背景 P5 很低，**必须加浅色描边**（.halo），否则小字糊。
    描边只改善肉眼可读性、不改善机检数值 —— 字色本身仍用纯黑。

  用法：<body data-lang="zh|en" data-axis>   机检 ?pf-qa=bg ／ #pf-boxes
-->
<style>
  /* ---------- 中文书法体（本地，随包） ---------- */
  @font-face { font-family: "ZhiMangXing";  src: url("fonts/ZhiMangXing-Regular.ttf")  format("truetype"); font-display: block; }
  @font-face { font-family: "MaShanZheng";  src: url("fonts/MaShanZheng-Regular.ttf")  format("truetype"); font-display: block; }
  @font-face { font-family: "LiuJianMaoCao"; src: url("fonts/LiuJianMaoCao-Regular.ttf") format("truetype"); font-display: block; }

  /* ---------- 英文（EB Garamond，SIL OFL，随包） ---------- */
  @font-face {
    font-family: "EB Garamond";
    src: url("fonts/EBGaramond-Variable.ttf") format("truetype");
    font-weight: 400 900;
    font-display: block;
  }

  :root {
    --stage-w: 1500px;
    --stage-h: 1875px;

    --ink:      #000000;
    --ink-2:    #14100B;
    --halo:     rgba(246, 242, 232, 0.88);
    --halo-soft:rgba(246, 242, 232, 0.50);
    --stage-bg: #EFE7D4;

    /* ★ 英文字体切换（2026-10-11 老大指定）：英文参考旧版定稿（Inter Black），
     EB Garamond 衬线「太纤细、撑不起画面」—— 英文层全部改 Inter。 */
  --f-en: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    /* 回退链只接同类书法体，末端不写 cursive（否则加载失败会静默退化成常规字体） */
    --f-zh-brush:  "ZhiMangXing", "MaShanZheng", "LiuJianMaoCao";
    --f-zh-brush2: "MaShanZheng", "ZhiMangXing", "LiuJianMaoCao";
    --f-zh-sans:   "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", sans-serif;

    /* 中轴文字区的位置与尺寸。
       上边界要留够：文字块底边不能压到中缝（敦煌案例中缝顶＝画布 y539）。
       本版实测块高 ≈430px，top 4.5%(84) → 底边 514，离中缝还有 25px 余量。 */
    --axis-top: 4.5%;
    /* 字号原则（组员评审后修订）：**不照抄参考海报的字号**，按「落字区能放多大」定。
       本版相对首版整体放大一档，并把标题从两行改一行以腾出空间。 */
    --size-glyph: 74px;    /* 66→74 */
    --size-main:  108px;   /* 92→108 */
    --size-foot:  28px;    /* 24→28 */
    --lh-main:    1.30;   /* ≥ 字体 hhea 行高：拉丁≈1.21、中文书法体≈1.4 */
    --track-main: 0.10em;
    --track-glyph: 0.20em;
    --track-foot: 0.14em;
    --gap: 18px;          /* 单字 ↔ 标题 的间距 */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #17130E; }

  .stage {
    position: relative;
    width: var(--stage-w);
    height: var(--stage-h);
    overflow: hidden;
    background: var(--stage-bg);
  }
  .stage > .bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    display: block;
  }
  .type { position: absolute; inset: 0; color: var(--ink); }

  /* ---------- 护读：浅色描边 + 柔光 ----------
     ⚠ 撕纸/岩壁类底材质**杂度高**（敦煌实测字框内 std 19–29），
     笔画细的黑字会「糊」进纹理里 —— 这个缺陷**对比度数值看不出来**，
     必须给笔画加一圈浅色轮廓，把它从花底里「托」出来。
     `paint-order: stroke fill` 是关键：描边画在字身**下面**，
     否则会侵蚀笔画内部、字反而变细。 */
  .halo {
    -webkit-text-stroke: 1.8px rgba(248, 244, 236, 0.92);
    paint-order: stroke fill;
    text-shadow:
      0 0 8px rgba(248, 244, 236, 0.65),
      0 0 20px rgba(248, 244, 236, 0.32);
  }
  .w-main, .glyph { -webkit-text-stroke-width: 2.4px; }

  /* ---------- 艺术字：scripts/art_title.py 生成的 span 效果 ----------
     参考海报（非遗系列）的中文大标题**不是端正排一行**，而是
     **大小错落 ＋ 纵向拉长 ＋ 高低错位 ＋ 轻微旋转**，有手写、动态的味道。
     **字体不变**（仍是书法体）；参数由 art_title.py 程序化生成（seed 可复现）。
     ⚠ `transform-origin: 50% 82%`（**以字脚为支点**）：拉长时向上长，不顶破基线。 */
  /* ⚠ 给 transform 留余量：旋转／拉长后的字形会超出 span 的框，
     Chrome 的 scrollWidth/Height **会**把它算进来 → 机检判 overflow。
     padding 撑开 + 负 margin 抵消，视觉位置不变。 */
  .art {
    display: flex; align-items: flex-start;
    /* 余量要按 em 给足：`--dy` 最大 ±16px，字号小的版式（中轴 124px）按 0.07em 只有 8.7px，
       不够 → 字形超出被算进 scrollHeight 判 overflow。0.15em 覆盖到最小字号也安全。 */
    padding: 0.15em 0.12em;
    margin: -0.15em -0.12em;
  }
  .art > span {
    display: inline-block;
    font-size: calc(1em * var(--s, 1));
    transform: translateY(var(--dy, 0)) rotate(var(--rot, 0deg)) scaleY(var(--sy, 1));
    transform-origin: 50% 82%;
  }
  .art.silhouette > span { color: transparent; -webkit-text-stroke: 3px var(--ink); }
  .w-main.art, .big.art { letter-spacing: 0; }

  /* ================= 中轴文字区 ================= */
  .axis {
    position: absolute;
    left: 0; right: 0; top: var(--axis-top);
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }
  .glyph {
    font-family: var(--f-zh-brush);
    font-size: var(--size-glyph);
    line-height: 1.25;
    letter-spacing: var(--track-glyph);
    text-indent: var(--track-glyph);      /* 字距使末字右侧多出一格，居中时用缩进抵消 */
  }
  .w-main {
    font-size: var(--size-main);
    line-height: var(--lh-main);
    letter-spacing: var(--track-main);
    text-indent: var(--track-main);
    margin: var(--gap) 0;
  }

  /* ================= 底部信息（仍居中于中轴）=================
     ⚠ 展讯必须**完整**落到海报上（副题／tagline／展期／时间／地点／预约），
     不能为了"极简"把它砍掉（2026-10-11 老大指出）。 */
  .foot {
    position: absolute;
    left: 0; right: 0; bottom: 4.6%;
    display: flex; flex-direction: column; align-items: center;
    gap: 12px;
    font-size: var(--size-foot);
    letter-spacing: var(--track-foot);
    text-indent: var(--track-foot);
    white-space: nowrap;
  }
  .foot .f-sub { font-size: calc(var(--size-foot) * 1.12); color: var(--ink); }
  .foot .f-tag { font-size: calc(var(--size-foot) * 0.90); color: var(--ink-2); }
  .cta {
    display: inline-block; margin-top: 6px;
    padding: 14px 40px; border-radius: 999px;
    background: var(--ink); color: #F2E9D8;
    font-size: calc(var(--size-foot) * 0.92);
    letter-spacing: 0.14em; text-indent: 0.14em;
    text-decoration: none;
  }

  /* ================= 语言 ================= */
  body[data-lang="zh"] .w-main { font-family: var(--f-zh-brush); }
  body[data-lang="zh"] .foot   { font-family: var(--f-zh-sans); font-weight: 600; }
  /* ★ 传播语（副题 .f-sub ／ tagline .f-tag）属**书法层**，不是信息层 ——
     落 sans／宋体都「不高级」（2026-10-11 老大指出）。
     只有展期／时间／地点／CTA 这些**纯信息**才允许 sans。楷书不加粗，保笔锋。 */
  body[data-lang="zh"] .foot .f-sub,
  body[data-lang="zh"] .foot .f-tag {
    font-family: var(--f-zh-brush2);
    font-weight: 400;
    letter-spacing: 0.10em;
  }
  body[data-lang="zh"] {
    /* 中文块比英文块高（字号更大 + 行高更大）。尺寸按「块底边不压中缝」反推：
       敦煌案例中缝顶＝y539；实测 62/90 时块高≈428，top 4.5%(84) → 底边 512，余量 27px。
       初版用 70/96 → 底边 549，压中缝 10px，且「煌」落进暗斑 CR 只剩 2.41。 */
    /* 标题改一行后才排得下这一档大字号 */
    /* ★ 2026-10-11 老大指出：标题与上下单字（敦／煌）**字号太接近，主次不分** ——
       拉开对比：标题放大 124→152，单字收到 82→70（比例 1.16→2.17），
       gap 18→14 换回高度，块底边仍留出中缝余量。 */
    --size-glyph: 70px;    /* 82→70（题眼单字不必抢主标题） */
    --size-main:  152px;   /* 124→152（主标题要明显压过单字） */
    --size-foot:  30px;    /* 25→30 */
    --lh-main:    1.32;
    --gap:        14px;    /* 18→14 */
  }

  body[data-lang="en"] .w-main { font-family: var(--f-en); font-weight: 900; }
  body[data-lang="en"] .foot   { font-family: var(--f-en); font-weight: 600; }
  body[data-lang="en"] {
    /* ★ 英文按旧版定稿放大加重（2026-10-11）：Inter Black 900 撑画面。
       ⚠ Inter Black 比衬线宽：「VISIONS ON THE WALL」≈11.6em＋字距，
       衬线时代的 114px 会超宽 → 收到 102px、字距 0.06→0.04em。
       实测式：(11.57 + 19×0.04)em × 102 ≈ 1258 ≤ 版心 1340 ✓ */
    --size-glyph: 74px;    /* 58→74 */
    --size-main:  102px;   /* 114→102（Inter Black 更宽，收一档保不超宽） */
    --size-foot:  26px;    /* 28→26，学参考的克制 */
    --lh-main:    1.32;    /* 1.24→1.32：Inter Black 的 win 纵向度量更高，
                              1.24 时实测 ovY（衬线时代不犯——字体换了度量也跟着换） */
    --track-main: 0.04em;
    --track-foot: 0.10em;
  }
  /* 传播语两档：副题粗、tagline 细（学参考） */
  body[data-lang="en"] .foot .f-sub { font-size: 30px; font-weight: 700; letter-spacing: 0.04em; }
  body[data-lang="en"] .foot .f-tag { font-size: 22px; font-weight: 400; }

  /* 机检仪器：?pf-qa=bg 时隐去文字墨色与描边。
     ⚠ `-webkit-text-stroke-color` **必须一起清** —— 只清 color 的话，浅色描边会留在
     「无字背景」里被当成背景亮度，机检数值虚高（实测踩过）。 */
  html.pf-qa-bg [data-text] {
    color: transparent !important;
    -webkit-text-stroke-color: transparent !important;
    text-shadow: none !important;
  }
</style>
</head>
<body data-lang="zh" data-axis>
  <div class="stage">
    <img class="bg" src="bg.png" alt="photo-cutout-forge 背景">

    <div class="type halo">
      <!-- ===== 中轴：单字 ▸ 标题 ▸ 单字（上下单字合成一个词）===== -->
      <div class="axis">
        <div class="glyph"  data-text="g-top">敦</div>
        <div class="w-main" data-text="t-main">壁上万象</div>
        <div class="glyph"  data-text="g-bottom">煌</div>
      </div>

      <!-- ===== 底部信息（中轴居中、极克制）===== -->
      <div class="foot">
        <span class="f-sub" data-text="f-1">敦煌色彩数字沉浸展</span>
        <span class="f-tag" data-text="f-2">在流动的色彩中，走近千年的想象</span>
        <span data-text="f-3">展期 2026.11.8 – 2027.1.18 ｜ 周二至周日 10:00–20:00</span>
        <span data-text="f-4">城市文化中心 · 一层沉浸展厅</span>
        <a class="cta" href="#" data-text="cta">预约观展</a>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var q = new URLSearchParams(location.search);
    var lang = q.get('lang');
    if (lang) document.body.setAttribute('data-lang', lang);
    if (q.get('pf-qa') === 'bg') document.documentElement.classList.add('pf-qa-bg');

    function dump() {
      var out = [];
      document.querySelectorAll('[data-text]').forEach(function (el) {
        var r = el.getBoundingClientRect(), cs = getComputedStyle(el);
        out.push({
          role: el.getAttribute('data-text'),
          x: r.x, y: r.y, w: r.width, h: r.height,
          color: cs.color,
          fontSize: parseFloat(cs.fontSize),
          writingMode: cs.writingMode || 'horizontal-tb',
          fontFamily: cs.fontFamily,
          text: (el.innerText || '').replace(/\s+/g, ' ').trim(),
          overflowX: el.scrollWidth > el.clientWidth + 4,
          overflowY: el.scrollHeight > el.clientHeight + 4
        });
      });
      var s = document.createElement('script');
      s.type = 'application/json';
      s.id = 'pf-boxes';
      s.textContent = JSON.stringify(out);
      document.body.appendChild(s);
    }
    if (document.readyState === 'complete') dump();
    else window.addEventListener('load', dump);
  })();
  </script>
</body>
</html>
